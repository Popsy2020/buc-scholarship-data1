name: Weekly Scholarship Fetch

on:
  schedule:
    # Runs every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # This allows you to manually click a button to run it anytime

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: pip install google-generativeai
        
      - name: Run Extraction Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_scholarships.py
        
      - name: Commit and Push Updates
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add latest_scholarships.json
          git commit -m "Automated weekly scholarship update" || exit 0
          git push
